[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoframe3d"
version = "0.1.0"
description = "Reproducible stress tests for CAD-to-scan registration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "fastapi>=0.110", "pydantic>=2.0", "uvicorn>=0.30", "huggingface_hub>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
autoframe3d = "autoframe3d.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["autoframe3d*"]
